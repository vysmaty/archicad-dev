name: Archicad Add-On build

on:
  push:
  pull_request:

jobs:
  python-quality:
    name: Python quality and repository contracts
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: recursive
      - uses: astral-sh/setup-uv@v10.0.1
      - name: Synchronize locked environment
        run: uv sync --all-groups --locked
      - name: Ruff formatting and lint
        run: |
          uv run ruff format --check .
          uv run ruff check .
      - name: Type check
        run: uv run ty check python/src tools tests python/examples python/templates
      - name: Unit tests and coverage
        run: uv run pytest --cov=archicad_tools --cov-report=term-missing --cov-fail-under=80
      - name: Build Python package
        run: uv build

  build:
    name: AC${{ matrix.version }} ${{ matrix.configuration }}
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: 27
            configuration: Debug
          - version: 27
            configuration: Release
          - version: 28
            configuration: Debug
          - version: 28
            configuration: Release
          - version: 29
            configuration: Debug
          - version: 29
            configuration: Release
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: recursive
      - uses: astral-sh/setup-uv@v10.0.1
      - name: Report Visual Studio toolchains
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" `
            -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64
      - name: Download pinned DevKit
        shell: pwsh
        run: .\tools\bootstrap.ps1 -Version ${{ matrix.version }}
      - name: Configure and build
        shell: pwsh
        run: .\tools\build.ps1 -Version ${{ matrix.version }} -Configuration ${{ matrix.configuration }}
      - uses: actions/upload-artifact@v4
        with:
          name: ArchicadDevAddOn-AC${{ matrix.version }}-${{ matrix.configuration }}
          path: build/**/ArchicadDevAddOn.apx
          if-no-files-found: error
