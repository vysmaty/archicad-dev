[project]
name = "archicad-dev-addon"
version = "0.1.0"
description = "Windows-first Archicad 27+ Add-On and automation foundation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "archicad==29.3000",
]

[build-system]
requires = ["uv_build>=0.8.5,<0.9"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = "python/src"
module-name = "archicad_tools"

[dependency-groups]
dev = [
    "pyyaml==6.0.2",
    "ruff>=0.16.4",
    "ty>=0.0.74",
]
test = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["external", "third_party", "build", "work"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
